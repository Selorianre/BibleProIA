<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BibleProIA</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f7f8;
            color: #202123;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 270px;
            background: #171717;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 18px 14px;
            flex-shrink: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: bold;
            padding: 8px 10px 20px;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: white;
            color: #171717;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            font-weight: bold;
        }

        .new-chat {
            width: 100%;
            border: 1px solid #444;
            background: #242424;
            color: white;
            border-radius: 8px;
            padding: 11px 12px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .new-chat:hover {
            background: #303030;
        }

        .history-title {
            font-size: 12px;
            color: #999;
            padding: 10px 10px 8px;
            text-transform: uppercase;
        }

        .history {
            flex: 1;
            overflow-y: auto;
        }

        .history-item {
            padding: 10px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            color: #ddd;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
        }

        .history-item:hover {
            background: #2b2b2b;
        }

        .history-item.active {
            background: #343434;
            color: white;
        }

        .account {
            border-top: 1px solid #333;
            padding-top: 12px;
            margin-top: 10px;
        }

        .account-email {
            font-size: 12px;
            color: #aaa;
            padding: 7px 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .account-button {
            width: 100%;
            border: none;
            background: transparent;
            color: #ddd;
            text-align: left;
            padding: 9px 10px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        .account-button:hover {
            background: #2b2b2b;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .topbar {
            height: 58px;
            border-bottom: 1px solid #e5e5e5;
            background: white;
            display: flex;
            align-items: center;
            padding: 0 24px;
            font-weight: 600;
        }

        .topbar-title {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .topbar-icon {
            width: 29px;
            height: 29px;
            border-radius: 8px;
            background: #202123;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        /* =========================
           CHAT
        ========================= */

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 35px 20px 150px;
        }

        .chat-inner {
            max-width: 850px;
            margin: 0 auto;
        }

        .welcome {
            min-height: 65vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .welcome-icon {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            background: #202123;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 20px;
        }

        .welcome h1 {
            margin: 0 0 10px;
            font-size: 30px;
        }

        .welcome p {
            margin: 0;
            color: #777;
            font-size: 15px;
        }

        .message {
            display: flex;
            margin: 20px auto;
            max-width: 850px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .user-bubble {
            background: #202123;
            color: white;
            border-radius: 18px;
            padding: 12px 16px;
            max-width: 75%;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .answer {
            max-width: 850px;
            margin: 28px auto;
        }

        .answer-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .ai-icon {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: #202123;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .answer-text {
            line-height: 1.7;
            white-space: pre-wrap;
            color: #292929;
        }

        /* =========================
           THINKING
        ========================= */

        .thinking {
            max-width: 850px;
            margin: 20px auto;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #777;
            font-size: 14px;
        }

        .thinking-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: #202123;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .dots span {
            animation: blink 1.4s infinite;
        }

        .dots span:nth-child(2) {
            animation-delay: .2s;
        }

        .dots span:nth-child(3) {
            animation-delay: .4s;
        }

        @keyframes blink {

            0%, 80%, 100% {
                opacity: .2;
            }

            40% {
                opacity: 1;
            }

        }

        /* =========================
           INPUT
        ========================= */

        .input-area {
            position: fixed;
            bottom: 0;
            left: 270px;
            right: 0;
            padding: 20px;
            background: linear-gradient(
                transparent,
                #f7f7f8 30%
            );
        }

        .input-box {
            max-width: 850px;
            margin: 0 auto;
            background: white;
            border: 1px solid #d9d9d9;
            border-radius: 15px;
            display: flex;
            align-items: flex-end;
            padding: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,.05);
        }

        textarea {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            min-height: 42px;
            max-height: 150px;
            padding: 11px 12px;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.5;
        }

        .send-button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 10px;
            background: #202123;
            color: white;
            cursor: pointer;
            font-size: 18px;
        }

        .send-button:hover {
            background: #000;
        }

        .send-button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        /* =========================
           LOGIN
        ========================= */

        .auth-panel {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .auth-box {
            width: 380px;
            max-width: calc(100% - 30px);
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,.2);
        }

        .auth-box h2 {
            margin-top: 0;
        }

        .auth-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
            outline: none;
        }

        .auth-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #202123;
            color: white;
            cursor: pointer;
            margin-top: 5px;
        }

        .auth-secondary {
            margin-top: 10px;
            width: 100%;
            border: none;
            background: transparent;
            cursor: pointer;
            color: #555;
        }

        .auth-message {
            font-size: 13px;
            color: #c00;
            margin-top: 10px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .sidebar {
                width: 220px;
            }

            .input-area {
                left: 220px;
            }

            .user-bubble {
                max-width: 85%;
            }

            .topbar {
                padding: 0 15px;
            }

            .chat {
                padding-left: 12px;
                padding-right: 12px;
            }

        }

        @media (max-width: 550px) {

            .sidebar {
                width: 200px;
            }

            .input-area {
                left: 200px;
                padding: 10px;
            }

            .welcome h1 {
                font-size: 25px;
            }

        }

    </style>

</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">
                ✝
            </div>

            BibleProIA

        </div>


        <button
            class="new-chat"
            id="new-chat"
        >
            ＋ Nouvelle conversation
        </button>


        <div class="history-title">
            Historique
        </div>


        <div
            class="history"
            id="history"
        >
        </div>


        <div class="account">

            <div
                class="account-email"
                id="account-email"
            >
                Non connecté
            </div>


            <button
                class="account-button"
                id="login-button"
            >
                Se connecter
            </button>


            <button
                class="account-button"
                id="signup-button"
            >
                Créer un compte
            </button>


            <button
                class="account-button"
                id="logout-button"
                style="display:none;"
            >
                Se déconnecter
            </button>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="topbar">

            <div class="topbar-title">

                <div class="topbar-icon">
                    ✝
                </div>

                BibleProIA

            </div>

        </header>


        <section
            class="chat"
            id="chat"
        >

            <div
                class="chat-inner"
                id="chat-inner"
            >

                {% if reponse %}

                <div
                    class="answer"
                    id="server-answer"
                >

                    <div class="answer-header">

                        <div class="ai-icon">
                            ✝
                        </div>

                        BibleProIA

                    </div>

                    <div class="answer-text">
                        {{ reponse }}
                    </div>

                </div>

                {% endif %}


                <div
                    class="welcome"
                    id="welcome"
                >

                    <div class="welcome-icon">
                        ✝
                    </div>

                    <h1>
                        Que souhaitez-vous savoir ?
                    </h1>

                    <p>
                        Posez votre question sur la Bible,
                        le christianisme ou l'adventisme.
                    </p>

                </div>


                <div
                    class="thinking"
                    id="thinking"
                    style="display:none;"
                >

                    <div class="thinking-icon">
                        ✝
                    </div>

                    <div>
                        BibleProIA réfléchit
                        <span class="dots">
                            <span>.</span>
                            <span>.</span>
                            <span>.</span>
                        </span>
                    </div>

                </div>

            </div>

        </section>

    </main>

</div>


<!-- INPUT -->

<div class="input-area">

    <form
        id="chat-form"
        class="input-box"
    >

        <textarea
            id="question"
            name="question"
            placeholder="Posez votre question..."
            rows="1"
            required
        ></textarea>


        <button
            type="submit"
            class="send-button"
            id="send-button"
        >
            ↑
        </button>

    </form>

</div>


<!-- AUTH -->

<div
    class="auth-panel"
    id="auth-panel"
>

    <div class="auth-box">

        <h2 id="auth-title">
            Connexion
        </h2>


        <input
            class="auth-input"
            id="auth-email"
            type="email"
            placeholder="Adresse e-mail"
        >


        <input
            class="auth-input"
            id="auth-password"
            type="password"
            placeholder="Mot de passe"
        >


        <input
            class="auth-input"
            id="auth-password-confirm"
            type="password"
            placeholder="Confirmer le mot de passe"
            style="display:none;"
        >


        <button
            class="auth-button"
            id="auth-submit"
        >
            Se connecter
        </button>


        <button
            class="auth-secondary"
            id="auth-switch"
        >
            Créer un compte
        </button>


        <button
            class="auth-secondary"
            id="auth-close"
        >
            Fermer
        </button>


        <div
            class="auth-message"
            id="auth-message"
        ></div>

    </div>

</div>


<script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
        "https://mcsigvlnaghtijgbxeqn.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_IIKiSAjRQJCGHUSGVidnqQ_vUsq8Epv";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* =========================
       VARIABLES
    ========================= */

    let currentConversationId = null;

    let authMode = "login";


    /* =========================
       ELEMENTS
    ========================= */

    const chatForm =
        document.getElementById("chat-form");

    const questionInput =
        document.getElementById("question");

    const sendButton =
        document.getElementById("send-button");

    const chat =
        document.getElementById("chat");

    const chatInner =
        document.getElementById("chat-inner");

    const history =
        document.getElementById("history");

    const newChatButton =
        document.getElementById("new-chat");

    const loginButton =
        document.getElementById("login-button");

    const signupButton =
        document.getElementById("signup-button");

    const logoutButton =
        document.getElementById("logout-button");

    const accountEmail =
        document.getElementById("account-email");

    const authPanel =
        document.getElementById("auth-panel");

    const authTitle =
        document.getElementById("auth-title");

    const authEmail =
        document.getElementById("auth-email");

    const authPassword =
        document.getElementById("auth-password");

    const authPasswordConfirm =
        document.getElementById(
            "auth-password-confirm"
        );

    const authSubmit =
        document.getElementById("auth-submit");

    const authSwitch =
        document.getElementById("auth-switch");

    const authClose =
        document.getElementById("auth-close");

    const authMessage =
        document.getElementById("auth-message");

    let thinking =
        document.getElementById("thinking");


    /* =========================
       AUTH PANEL
    ========================= */

    function openAuth(mode) {

        authMode = mode;

        authPanel.style.display = "flex";

        authMessage.textContent = "";

        authMessage.style.color = "#c00";

        authEmail.value = "";

        authPassword.value = "";

        authPasswordConfirm.value = "";


        if (mode === "login") {

            authTitle.textContent =
                "Connexion";

            authSubmit.textContent =
                "Se connecter";

            authSwitch.textContent =
                "Créer un compte";

            authPasswordConfirm.style.display =
                "none";

        } else {

            authTitle.textContent =
                "Créer un compte";

            authSubmit.textContent =
                "Créer mon compte";

            authSwitch.textContent =
                "Se connecter";

            authPasswordConfirm.style.display =
                "block";

        }

    }


    function closeAuth() {

        authPanel.style.display =
            "none";

        authMessage.textContent =
            "";

    }


    loginButton.addEventListener(
        "click",
        () => openAuth("login")
    );


    signupButton.addEventListener(
        "click",
        () => openAuth("signup")
    );


    authClose.addEventListener(
        "click",
        closeAuth
    );


    authSwitch.addEventListener(
        "click",
        () => {

            if (authMode === "login") {

                openAuth("signup");

            } else {

                openAuth("login");

            }

        }
    );


    /* =========================
       LOGIN / SIGNUP
    ========================= */

    authSubmit.addEventListener(
        "click",
        async () => {

            const email =
                authEmail.value.trim();

            const password =
                authPassword.value;


            if (!email || !password) {

                authMessage.textContent =
                    "Veuillez remplir tous les champs.";

                return;

            }


            authSubmit.disabled =
                true;


            try {

                if (authMode === "signup") {

                    const confirm =
                        authPasswordConfirm.value;


                    if (password !== confirm) {

                        authMessage.textContent =
                            "Les mots de passe ne correspondent pas.";

                        return;

                    }


                    const {
                        error
                    } =
                        await supabaseClient.auth.signUp({
                            email: email,
                            password: password
                        });


                    if (error) {

                        authMessage.textContent =
                            error.message;

                        return;

                    }


                    authMessage.style.color =
                        "green";

                    authMessage.textContent =
                        "Compte créé avec succès.";


                    setTimeout(
                        closeAuth,
                        1200
                    );


                } else {

                    const {
                        error
                    } =
                        await supabaseClient.auth.signInWithPassword({
                            email: email,
                            password: password
                        });


                    if (error) {

                        authMessage.textContent =
                            error.message;

                        return;

                    }


                    closeAuth();

                    await updateAccountUI();

                    await loadConversations();

                }

            } catch (error) {

                authMessage.textContent =
                    error.message;

            } finally {

                authSubmit.disabled =
                    false;

            }

        }
    );


    /* =========================
       ACCOUNT UI
    ========================= */

    async function updateAccountUI() {

        const {
            data,
            error
        } =
            await supabaseClient.auth.getUser();


        if (error) {

            console.error(
                "Erreur utilisateur:",
                error
            );

        }


        const user =
            data.user;


        if (user) {

            accountEmail.textContent =
                user.email;

            loginButton.style.display =
                "none";

            signupButton.style.display =
                "none";

            logoutButton.style.display =
                "block";

        } else {

            accountEmail.textContent =
                "Non connecté";

            loginButton.style.display =
                "block";

            signupButton.style.display =
                "block";

            logoutButton.style.display =
                "none";

        }

    }


    logoutButton.addEventListener(
        "click",
        async () => {

            await supabaseClient.auth.signOut();

            currentConversationId =
                null;

            startNewConversation();

            await updateAccountUI();

            await loadConversations();

        }
    );


    /* =========================
       CREATE CONVERSATION
    ========================= */

    async function createConversation(title) {

        const {
            data,
            error: userError
        } =
            await supabaseClient.auth.getUser();


        if (userError) {

            console.error(
                "Erreur utilisateur:",
                userError
            );

            return null;

        }


        const user =
            data.user;


        if (!user) {

            console.log(
                "Utilisateur non connecté."
            );

            return null;

        }


        const {
            data: conversation,
            error
        } =
            await supabaseClient
                .from("conversations")
                .insert({
                    user_id: user.id,
                    title:
                        title ||
                        "Nouvelle conversation"
                })
                .select()
                .single();


        if (error) {

            console.error(
                "Erreur création conversation:",
                error
            );

            return null;

        }


        console.log(
            "Conversation créée:",
            conversation
        );


        return conversation;

    }


    /* =========================
       LOAD CONVERSATIONS
    ========================= */

    async function loadConversations() {

        history.innerHTML = "";


        const {
            data,
            error: userError
        } =
            await supabaseClient.auth.getUser();


        if (userError) {

            console.error(
                "Erreur utilisateur:",
                userError
            );

            return;

        }


        const user =
            data.user;


        if (!user) {

            return;

        }


        const {
            data: conversations,
            error
        } =
            await supabaseClient
                .from("conversations")
                .select("*")
                .eq(
                    "user_id",
                    user.id
                )
                .order(
                    "updated_at",
                    {
                        ascending: false
                    }
                );


        if (error) {

            console.error(
                "Erreur historique:",
                error
            );

            return;

        }


        if (
            !conversations ||
            conversations.length === 0
        ) {

            return;

        }


        conversations.forEach(
            conversation => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "history-item";


                if (
                    conversation.id ===
                    currentConversationId
                ) {

                    item.classList.add(
                        "active"
                    );

                }


                item.textContent =
                    conversation.title;


                item.title =
                    conversation.title;


                item.addEventListener(
                    "click",
                    () => {

                        loadConversation(
                            conversation.id
                        );

                    }
                );


                history.appendChild(
                    item
                );

            }
        );

    }


    /* =========================
       SAVE MESSAGE
    ========================= */

    async function saveMessage(
        conversationId,
        role,
        content
    ) {

        const {
            data,
            error: userError
        } =
            await supabaseClient.auth.getUser();


        if (userError) {

            console.error(
                "Erreur utilisateur:",
                userError
            );

            return false;

        }


        const user =
            data.user;


        if (!user) {

            return false;

        }


        const {
            error
        } =
            await supabaseClient
                .from("messages")
                .insert({
                    conversation_id:
                        conversationId,
                    user_id:
                        user.id,
                    role:
                        role,
                    content:
                        content
                });


        if (error) {

            console.error(
                "Erreur sauvegarde message:",
                error
            );

            return false;

        }


        return true;

    }


    /* =========================
       UPDATE CONVERSATION
    ========================= */

    async function updateConversationTime(
        conversationId
    ) {

        if (!conversationId) {
            return;
        }


        const {
            error
        } =
            await supabaseClient
                .from("conversations")
                .update({
                    updated_at:
                        new Date().toISOString()
                })
                .eq(
                    "id",
                    conversationId
                );


        if (error) {

            console.error(
                "Erreur mise à jour conversation:",
                error
            );

        }

    }


    /* =========================
       LOAD ONE CONVERSATION
    ========================= */

    async function loadConversation(
        conversationId
    ) {

        currentConversationId =
            conversationId;


        chatInner.innerHTML = "";


        const {
            data: messages,
            error
        } =
            await supabaseClient
                .from("messages")
                .select("*")
                .eq(
                    "conversation_id",
                    conversationId
                )
                .order(
                    "created_at",
                    {
                        ascending: true
                    }
                );


        if (error) {

            console.error(
                "Erreur chargement conversation:",
                error
            );

            showWelcome();

            return;

        }


        if (
            !messages ||
            messages.length === 0
        ) {

            showWelcome();

        } else {

            messages.forEach(
                message => {

                    if (
                        message.role ===
                        "user"
                    ) {

                        addUserMessage(
                            message.content
                        );

                    } else {

                        addAIMessageText(
                            message.content
                        );

                    }

                }
            );

        }


        await loadConversations();

        scrollToBottom();

    }


    /* =========================
       NEW CONVERSATION
    ========================= */

    function startNewConversation() {

        currentConversationId =
            null;


        chatInner.innerHTML = "";


        showWelcome();


        questionInput.value =
            "";


        questionInput.focus();


        loadConversations();

    }


    newChatButton.addEventListener(
        "click",
        startNewConversation
    );


    /* =========================
       WELCOME
    ========================= */

    function showWelcome() {

        chatInner.innerHTML = `

            <div
                class="welcome"
                id="welcome"
            >

                <div class="welcome-icon">
                    ✝
                </div>

                <h1>
                    Que souhaitez-vous savoir ?
                </h1>

                <p>
                    Posez votre question sur la Bible,
                    le christianisme ou l'adventisme.
                </p>

            </div>


            <div
                class="thinking"
                id="thinking"
                style="display:none;"
            >

                <div class="thinking-icon">
                    ✝
                </div>

                <div>
                    BibleProIA réfléchit
                    <span class="dots">
                        <span>.</span>
                        <span>.</span>
                        <span>.</span>
                    </span>
                </div>

            </div>

        `;


        thinking =
            document.getElementById(
                "thinking"
            );

    }


    /* =========================
       USER MESSAGE
    ========================= */

    function addUserMessage(
        text
    ) {

        const message =
            document.createElement(
                "div"
            );


        message.className =
            "message user";


        const bubble =
            document.createElement(
                "div"
            );


        bubble.className =
            "user-bubble";


        bubble.textContent =
            text;


        message.appendChild(
            bubble
        );


        const thinkingElement =
            document.getElementById(
                "thinking"
            );


        if (thinkingElement) {

            chatInner.insertBefore(
                message,
                thinkingElement
            );

        } else {

            chatInner.appendChild(
                message
            );

        }


        scrollToBottom();

    }


    /* =========================
       AI MESSAGE
    ========================= */

    function addAIMessageText(
        text
    ) {

        const answer =
            document.createElement(
                "div"
            );


        answer.className =
            "answer";


        const header =
            document.createElement(
                "div"
            );


        header.className =
            "answer-header";


        const icon =
            document.createElement(
                "div"
            );


        icon.className =
            "ai-icon";


        icon.textContent =
            "✝";


        header.appendChild(
            icon
        );


        header.appendChild(
            document.createTextNode(
                "BibleProIA"
            )
        );


        const textElement =
            document.createElement(
                "div"
            );


        textElement.className =
            "answer-text";


        textElement.textContent =
            text;


        answer.appendChild(
            header
        );


        answer.appendChild(
            textElement
        );


        const thinkingElement =
            document.getElementById(
                "thinking"
            );


        if (thinkingElement) {

            chatInner.insertBefore(
                answer,
                thinkingElement
            );

        } else {

            chatInner.appendChild(
                answer
            );

        }


        scrollToBottom();

    }


    /* =========================
       SERVER ANSWER
    ========================= */

    function addAIMessage(
        answerElement
    ) {

        if (!answerElement) {

            return false;

        }


        const textElement =
            answerElement.querySelector(
                ".answer-text"
            );


        if (!textElement) {

            return false;

        }


        addAIMessageText(
            textElement.textContent
        );


        return true;

    }


    /* =========================
       SCROLL
    ========================= */

    function scrollToBottom() {

        setTimeout(
            () => {

                chat.scrollTop =
                    chat.scrollHeight;

            },
            10
        );

    }


    /* =========================
       SEND MESSAGE
    ========================= */

    chatForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const question =
                questionInput.value.trim();


            if (!question) {

                return;

            }


            sendButton.disabled =
                true;

            questionInput.disabled =
                true;


            try {

                /*
                 * 1.
                 * Si aucune conversation n'existe,
                 * on la crée immédiatement.
                 */

                if (!currentConversationId) {

                    const conversation =
                        await createConversation(
                            question.substring(
                                0,
                                60
                            )
                        );


                    if (!conversation) {

                        addAIMessageText(
                            "Impossible de créer la conversation. Vérifiez que vous êtes connecté."
                        );

                        return;

                    }


                    currentConversationId =
                        conversation.id;


                    /*
                     * 2.
                     * Elle apparaît immédiatement
                     * dans la colonne de gauche.
                     */

                    await loadConversations();

                }


                /*
                 * 3.
                 * Retirer l'écran d'accueil.
                 */

                const oldWelcome =
                    document.getElementById(
                        "welcome"
                    );


                if (oldWelcome) {

                    oldWelcome.remove();

                }


                /*
                 * 4.
                 * Afficher le message utilisateur.
                 */

                addUserMessage(
                    question
                );


                /*
                 * 5.
                 * Enregistrer le message.
                 */

                await saveMessage(
                    currentConversationId,
                    "user",
                    question
                );


                /*
                 * 6.
                 * Mettre à jour la date
                 * de la conversation.
                 */

                await updateConversationTime(
                    currentConversationId
                );


                questionInput.value =
                    "";


                /*
                 * 7.
                 * Afficher "BibleProIA réfléchit..."
                 */

                thinking =
                    document.getElementById(
                        "thinking"
                    );


                if (!thinking) {

                    thinking =
                        document.createElement(
                            "div"
                        );


                    thinking.className =
                        "thinking";


                    thinking.id =
                        "thinking";


                    thinking.innerHTML = `

                        <div class="thinking-icon">
                            ✝
                        </div>

                        <div>
                            BibleProIA réfléchit
                            <span class="dots">
                                <span>.</span>
                                <span>.</span>
                                <span>.</span>
                            </span>
                        </div>

                    `;


                    chatInner.appendChild(
                        thinking
                    );

                }


                thinking.style.display =
                    "flex";


                scrollToBottom();


                /*
                 * 8.
                 * Envoyer la question à Flask.
                 */

                const formData =
                    new FormData();


                formData.append(
                    "question",
                    question
                );


                const response =
                    await fetch(
                        "/",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const html =
                    await response.text();


                /*
                 * 9.
                 * Lire la réponse générée
                 * par Flask.
                 */

                const parser =
                    new DOMParser();


                const responseDocument =
                    parser.parseFromString(
                        html,
                        "text/html"
                    );


                const answer =
                    responseDocument.querySelector(
                        ".answer"
                    );


                if (thinking) {

                    thinking.style.display =
                        "none";

                }


                if (!answer) {

                    console.error(
                        "Réponse serveur introuvable."
                    );


                    addAIMessageText(
                        "Une erreur est survenue lors de la génération de la réponse."
                    );


                } else {

                    /*
                     * 10.
                     * Afficher la réponse.
                     */

                    addAIMessage(
                        answer
                    );


                    const answerText =
                        answer.querySelector(
                            ".answer-text"
                        );


                    /*
                     * 11.
                     * Enregistrer la réponse
                     * dans Supabase.
                     */

                    if (
                        answerText &&
                        currentConversationId
                    ) {

                        await saveMessage(
                            currentConversationId,
                            "assistant",
                            answerText.textContent
                        );


                        await updateConversationTime(
                            currentConversationId
                        );

                    }

                }


                /*
                 * 12.
                 * Actualiser l'historique.
                 */

                await loadConversations();


                scrollToBottom();

            } catch (error) {

                console.error(
                    "Erreur:",
                    error
                );


                if (thinking) {

                    thinking.style.display =
                        "none";

                }


                addAIMessageText(
                    "Une erreur est survenue lors de la génération de la réponse."
                );

            } finally {

                sendButton.disabled =
                    false;

                questionInput.disabled =
                    false;

                questionInput.focus();

                scrollToBottom();

            }

        }
    );


    /* =========================
       TEXTAREA
    ========================= */

    questionInput.addEventListener(
        "input",
        () => {

            questionInput.style.height =
                "auto";


            questionInput.style.height =
                Math.min(
                    questionInput.scrollHeight,
                    150
                ) + "px";

        }
    );


    questionInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                chatForm.requestSubmit();

            }

        }
    );


    /* =========================
       AUTH STATE
    ========================= */

    supabaseClient.auth.onAuthStateChange(
        async () => {

            await updateAccountUI();

            await loadConversations();

        }
    );


    /* =========================
       INITIALISATION
    ========================= */

    async function initialize() {

        await updateAccountUI();

        await loadConversations();

    }


    initialize();

</script>

</body>

</html>
