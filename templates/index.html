<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BibleProIA</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 280px;
            background: #171a22;
            border-right: 1px solid #292d38;
            display: flex;
            flex-direction: column;
            padding: 18px;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .new-chat {
            width: 100%;
            padding: 12px;
            border: 1px solid #343945;
            background: #222631;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            margin-bottom: 22px;
        }

        .new-chat:hover {
            background: #2b303c;
        }

        .history-title {
            font-size: 13px;
            color: #8e94a3;
            margin-bottom: 10px;
        }

        .history {
            flex: 1;
            overflow-y: auto;
        }

        .conversation {
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            color: #d9dce4;
            font-size: 14px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation:hover {
            background: #252a35;
        }

        .conversation.active {
            background: #292f3c;
        }

        .account {
            border-top: 1px solid #292d38;
            padding-top: 15px;
            margin-top: 10px;
        }

        .account-email {
            font-size: 13px;
            color: #aeb3bf;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .auth-button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #292f3c;
            color: white;
        }

        /* MAIN */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 35px 15%;
        }

        .welcome {
            text-align: center;
            margin-top: 15vh;
        }

        .welcome h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #969cab;
        }

        .message {
            display: flex;
            margin-bottom: 25px;
            max-width: 900px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.user .bubble {
            background: #292f3c;
            padding: 12px 16px;
            border-radius: 16px;
            max-width: 75%;
            white-space: pre-wrap;
        }

        .message.ai {
            align-items: flex-start;
        }

        .ai-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #252a35;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            flex-shrink: 0;
            font-size: 15px;
        }

        .ai-content {
            max-width: 80%;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .thinking {
            display: flex;
            align-items: center;
            color: #9da3b1;
            margin-bottom: 25px;
        }

        .thinking .ai-icon {
            margin-right: 10px;
        }

        .dots span {
            animation: blink 1.4s infinite;
        }

        .dots span:nth-child(2) {
            animation-delay: .2s;
        }

        .dots span:nth-child(3) {
            animation-delay: .4s;
        }

        @keyframes blink {
            0%, 80%, 100% {
                opacity: .2;
            }

            40% {
                opacity: 1;
            }
        }

        /* INPUT */

        .input-area {
            padding: 15px 15%;
            border-top: 1px solid #292d38;
            background: #0f1117;
        }

        .input-wrapper {
            display: flex;
            background: #191c24;
            border: 1px solid #303541;
            border-radius: 14px;
            padding: 6px;
        }

        textarea {
            flex: 1;
            resize: none;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            padding: 12px;
            font-size: 15px;
            min-height: 45px;
            max-height: 150px;
        }

        .send {
            width: 45px;
            border: none;
            border-radius: 10px;
            background: #fff;
            color: #111;
            cursor: pointer;
            font-size: 18px;
        }

        .send:disabled {
            opacity: .4;
            cursor: default;
        }

        .error {
            color: #ff7777;
            background: #2b1717;
            border: 1px solid #633333;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        /* AUTH */

        .auth-panel {
            display: flex;
            gap: 8px;
            flex-direction: column;
        }

        .auth-panel button {
            padding: 9px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #292f3c;
            color: white;
        }

        /* MOBILE */

        @media (max-width: 800px) {
            .sidebar {
                width: 220px;
            }

            .chat,
            .input-area {
                padding-left: 5%;
                padding-right: 5%;
            }
        }

        @media (max-width: 600px) {
            .sidebar {
                width: 200px;
            }

            .message.user .bubble {
                max-width: 90%;
            }

            .ai-content {
                max-width: 90%;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            ✝ BibleProIA
        </div>

        <button class="new-chat" id="new-chat">
            ＋ Nouvelle conversation
        </button>

        <div class="history-title">

        </div>

        <div class="history" id="history">
            <div style="color:#777;font-size:13px;">
                Chargement...
            </div>
        </div>

        <div class="account" id="account">

            <div class="account-email" id="account-email">
                Non connecté
            </div>

            <div class="auth-panel" id="auth-panel">

                <button id="login-button">
                    Se connecter
                </button>

                <button id="signup-button">
                    Créer un compte
                </button>

            </div>

            <button
                class="auth-button"
                id="logout-button"
                style="display:none;"
            >
                Se déconnecter
            </button>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <div class="chat" id="chat">

            <div class="welcome" id="welcome">

                <h1>BibleProIA</h1>

                <p>
                    Posez vos questions sur la Bible,
                    le christianisme et l'adventisme.
                </p>

            </div>

        </div>


        <div class="input-area">

            <form id="chat-form">

                <div class="input-wrapper">

                    <textarea
                        id="question"
                        placeholder="Posez votre question..."
                        rows="1"
                    ></textarea>

                    <button
                        class="send"
                        id="send"
                        type="submit"
                    >
                        ➤
                    </button>

                </div>

            </form>

        </div>

    </main>

</div>


<script>

const SUPABASE_URL =
    "https://mcsigvlnaghtijgbxeqn.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_IIKiSAjRQJCGHUSGVidnqQ_vUsq8Epv";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let currentUser = null;
let currentConversationId = null;
let loadingMessage = false;


/* =========================
   UTILITAIRES
========================= */

function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =========================
   AUTHENTIFICATION
========================= */

async function updateAuthUI() {

    const {
        data: {
            session
        },
        error
    } = await supabaseClient.auth.getSession();

    if (error) {

        console.error(
            "Erreur récupération session :",
            error
        );

        return;
    }

    currentUser = session?.user || null;

    const email =
        document.getElementById("account-email");

    const authPanel =
        document.getElementById("auth-panel");

    const logoutButton =
        document.getElementById("logout-button");


    if (currentUser) {

        email.textContent =
            currentUser.email || "Compte connecté";

        authPanel.style.display = "none";

        logoutButton.style.display = "block";

        console.log(
            "Utilisateur connecté :",
            currentUser.id
        );

    } else {

        email.textContent = "Non connecté";

        authPanel.style.display = "flex";

        logoutButton.style.display = "none";

        console.log("Aucun utilisateur connecté.");
    }

    await loadConversations();
}


/* =========================
   CREATION CONVERSATION
========================= */

async function createConversation(title) {

    console.log(
        "Tentative de création de conversation..."
    );

    const {
        data: {
            session
        },
        error: sessionError
    } = await supabaseClient.auth.getSession();


    if (sessionError) {

        console.error(
            "Erreur session Supabase :",
            sessionError
        );

        throw new Error(
            "Erreur Supabase lors de la récupération de la session : " +
            sessionError.message
        );
    }


    if (!session || !session.user) {

        throw new Error(
            "Aucun utilisateur connecté. Connectez-vous avant de créer une conversation."
        );
    }


    const userId =
        session.user.id;


    console.log(
        "Création pour user_id :",
        userId
    );


    const {
        data,
        error
    } = await supabaseClient
        .from("conversations")
        .insert({

            user_id: userId,

            title:
                title ||
                "Nouvelle conversation"

        })
        .select()
        .single();


    if (error) {

        console.error(
            "ERREUR SUPABASE CREATION CONVERSATION :",
            error
        );

        throw new Error(
            "Supabase : " +
            error.message +
            (error.details
                ? "\nDétails : " + error.details
                : "") +
            (error.hint
                ? "\nIndice : " + error.hint
                : "")
        );
    }


    console.log(
        "Conversation créée :",
        data
    );


    return data;
}


/* =========================
   HISTORIQUE
========================= */

async function loadConversations() {

    const history =
        document.getElementById("history");


    if (!currentUser) {

        history.innerHTML = `
            <div style="color:#777;font-size:13px;">
                Connectez-vous pour voir votre historique.
            </div>
        `;

        return;
    }


    console.log(
        "Chargement des conversations..."
    );


    const {
        data,
        error
    } = await supabaseClient
        .from("conversations")
        .select("*")
        .eq("user_id", currentUser.id)
        .order("updated_at", {
            ascending: false
        });


    if (error) {

        console.error(
            "Erreur chargement historique :",
            error
        );

        history.innerHTML = `
            <div style="color:#ff7777;font-size:13px;">
                Erreur historique :<br>
                ${escapeHtml(error.message)}
            </div>
        `;

        return;
    }


    history.innerHTML = "";


    if (!data || data.length === 0) {

        history.innerHTML = `
            <div style="color:#777;font-size:13px;">
                Aucune conversation.
            </div>
        `;

        return;
    }


    data.forEach(conversation => {

        const element =
            document.createElement("div");

        element.className =
            "conversation";


        if (
            conversation.id ===
            currentConversationId
        ) {

            element.classList.add("active");
        }


        element.textContent =
            conversation.title;


        element.onclick = () => {

            loadConversation(
                conversation.id
            );

        };


        history.appendChild(element);

    });
}


/* =========================
   SAUVEGARDE MESSAGE
========================= */

async function saveMessage(
    conversationId,
    role,
    content
) {

    if (!currentUser) {

        console.warn(
            "Impossible de sauvegarder : utilisateur non connecté."
        );

        return;
    }


    const {
        error
    } = await supabaseClient
        .from("messages")
        .insert({

            conversation_id:
                conversationId,

            user_id:
                currentUser.id,

            role:
                role,

            content:
                content

        });


    if (error) {

        console.error(
            "Erreur sauvegarde message :",
            error
        );

        throw new Error(
            "Erreur sauvegarde message : " +
            error.message
        );
    }
}


/* =========================
   DATE CONVERSATION
========================= */

async function updateConversationTime(
    conversationId
) {

    const {
        error
    } = await supabaseClient
        .from("conversations")
        .update({

            updated_at:
                new Date().toISOString()

        })
        .eq("id", conversationId)
        .eq("user_id", currentUser.id);


    if (error) {

        console.error(
            "Erreur mise à jour conversation :",
            error
        );
    }
}


/* =========================
   CHARGER CONVERSATION
========================= */

async function loadConversation(
    conversationId
) {

    if (!currentUser) {
        return;
    }


    const {
        data,
        error
    } = await supabaseClient
        .from("messages")
        .select("*")
        .eq(
            "conversation_id",
            conversationId
        )
        .eq(
            "user_id",
            currentUser.id
        )
        .order("created_at", {
            ascending: true
        });


    if (error) {

        console.error(
            "Erreur chargement messages :",
            error
        );

        return;
    }


    currentConversationId =
        conversationId;


    const chat =
        document.getElementById("chat");


    chat.innerHTML = "";


    if (!data || data.length === 0) {

        showWelcome();

    } else {

        data.forEach(message => {

            if (message.role === "user") {

                addUserMessage(
                    message.content
                );

            } else {

                addAIMessageText(
                    message.content
                );

            }

        });

    }


    await loadConversations();

    scrollToBottom();
}


/* =========================
   NOUVELLE CONVERSATION
========================= */

function startNewConversation() {

    currentConversationId = null;

    showWelcome();

    document
        .getElementById("question")
        .focus();

    loadConversations();
}


/* =========================
   WELCOME
========================= */

function showWelcome() {

    document.getElementById("chat").innerHTML = `

        <div class="welcome" id="welcome">

            <h1>BibleProIA</h1>

            <p>
                Posez vos questions sur la Bible,
                le christianisme et l'adventisme.
            </p>

        </div>

    `;
}


/* =========================
   MESSAGE UTILISATEUR
========================= */

function addUserMessage(text) {

    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }


    const chat =
        document.getElementById("chat");


    const message =
        document.createElement("div");

    message.className =
        "message user";


    message.innerHTML = `

        <div class="bubble">
            ${escapeHtml(text)}
        </div>

    `;


    chat.appendChild(message);

    scrollToBottom();
}


/* =========================
   MESSAGE IA
========================= */

function addAIMessageText(text) {

    const chat =
        document.getElementById("chat");


    const message =
        document.createElement("div");

    message.className =
        "message ai";


    message.innerHTML = `

        <div class="ai-icon">
            ✝
        </div>

        <div class="ai-content">
            ${escapeHtml(text)}
        </div>

    `;


    chat.appendChild(message);

    scrollToBottom();
}


/* =========================
   THINKING
========================= */

function showThinking() {

    removeThinking();


    const chat =
        document.getElementById("chat");


    const thinking =
        document.createElement("div");

    thinking.className =
        "thinking";

    thinking.id =
        "thinking";


    thinking.innerHTML = `

        <div class="ai-icon">
            ✝
        </div>

        <div>
            BibleProIA réfléchit
            <span class="dots">
                <span>.</span>
                <span>.</span>
                <span>.</span>
            </span>
        </div>

    `;


    chat.appendChild(thinking);

    scrollToBottom();
}


function removeThinking() {

    const thinking =
        document.getElementById("thinking");

    if (thinking) {
        thinking.remove();
    }
}


/* =========================
   SCROLL
========================= */

function scrollToBottom() {

    const chat =
        document.getElementById("chat");

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================
   FORMULAIRE CHAT
========================= */

document
    .getElementById("chat-form")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            if (loadingMessage) {
                return;
            }


            const input =
                document.getElementById("question");

            const send =
