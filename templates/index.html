<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://mcsigvlnaghtijgbxeqn.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_IIKiSAjRQJCGHUSGVidnqQ_vUsq8Epv";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   VARIABLES
========================= */

let currentUser = null;
let currentConversationId = null;
let loadingMessage = false;


/* =========================
   UTILITAIRES
========================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


function scrollToBottom() {

    const chat =
        document.getElementById("chat");

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================
   AUTH MODAL
========================= */

const authModal =
    document.getElementById("auth-modal");

const loginTab =
    document.getElementById("login-tab");

const signupTab =
    document.getElementById("signup-tab");

const loginForm =
    document.getElementById("login-form");

const signupForm =
    document.getElementById("signup-form");

const authMessage =
    document.getElementById("auth-message");


function openAuthModal(mode = "login") {

    authModal.classList.add("show");

    clearAuthMessage();

    if (mode === "signup") {

        showSignupForm();

    } else {

        showLoginForm();

    }

    setTimeout(() => {

        if (mode === "signup") {

            document
                .getElementById("signup-email")
                .focus();

        } else {

            document
                .getElementById("login-email")
                .focus();

        }

    }, 100);
}


function closeAuthModal() {

    authModal.classList.remove("show");

    clearAuthMessage();

    loginForm.reset();

    signupForm.reset();
}


function showLoginForm() {

    loginTab.classList.add("active");
    signupTab.classList.remove("active");

    loginForm.classList.add("active");
    signupForm.classList.remove("active");

    clearAuthMessage();
}


function showSignupForm() {

    signupTab.classList.add("active");
    loginTab.classList.remove("active");

    signupForm.classList.add("active");
    loginForm.classList.remove("active");

    clearAuthMessage();
}


function clearAuthMessage() {

    authMessage.textContent = "";

    authMessage.className =
        "auth-message";
}


function showAuthError(message) {

    authMessage.textContent =
        message;

    authMessage.className =
        "auth-message error-message";
}


function showAuthSuccess(message) {

    authMessage.textContent =
        message;

    authMessage.className =
        "auth-message success-message";
}


document
    .getElementById("login-button")
    .addEventListener(
        "click",
        () => openAuthModal("login")
    );


document
    .getElementById("signup-button")
    .addEventListener(
        "click",
        () => openAuthModal("signup")
    );


document
    .getElementById("close-auth-modal")
    .addEventListener(
        "click",
        closeAuthModal
    );


authModal.addEventListener(
    "click",
    function(event) {

        if (event.target === authModal) {

            closeAuthModal();

        }

    }
);


loginTab.addEventListener(
    "click",
    showLoginForm
);


signupTab.addEventListener(
    "click",
    showSignupForm
);


/* =========================
   CONNEXION
========================= */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        clearAuthMessage();


        const email =
            document
                .getElementById("login-email")
                .value
                .trim();

        const password =
            document
                .getElementById("login-password")
                .value;


        const button =
            document.getElementById(
                "login-submit"
            );


        button.disabled = true;

        button.textContent =
            "Connexion...";


        try {

            const {
                data,
                error
            } =
                await supabaseClient.auth
                    .signInWithPassword({

                        email:
                            email,

                        password:
                            password

                    });


            if (error) {

                showAuthError(
                    "Connexion impossible :\n" +
                    error.message
                );

                return;
            }


            currentUser =
                data.user;


            showAuthSuccess(
                "Connexion réussie."
            );


            setTimeout(
                closeAuthModal,
                600
            );


            await updateAuthUI();


        } catch (error) {

            console.error(
                "Erreur connexion :",
                error
            );

            showAuthError(
                "Une erreur est survenue :\n" +
                error.message
            );

        } finally {

            button.disabled = false;

            button.textContent =
                "Se connecter";

        }

    }
);


/* =========================
   INSCRIPTION
========================= */

signupForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        clearAuthMessage();


        const email =
            document
                .getElementById("signup-email")
                .value
                .trim();

        const password =
            document
                .getElementById("signup-password")
                .value;

        const confirmation =
            document
                .getElementById("signup-password-confirm")
                .value;


        if (password !== confirmation) {

            showAuthError(
                "Les deux mots de passe ne correspondent pas."
            );

            return;
        }


        const button =
            document.getElementById(
                "signup-submit"
            );


        button.disabled = true;

        button.textContent =
            "Création du compte...";


        try {

            const {
                data,
                error
            } =
                await supabaseClient.auth
                    .signUp({

                        email:
                            email,

                        password:
                            password

                    });


            if (error) {

                showAuthError(
                    "Création impossible :\n" +
                    error.message
                );

                return;
            }


            if (data.session) {

                currentUser =
                    data.user;


                showAuthSuccess(
                    "Compte créé avec succès."
                );


                setTimeout(
                    closeAuthModal,
                    700
                );


                await updateAuthUI();

            } else {

                showAuthSuccess(
                    "Compte créé. Vous pouvez maintenant vous connecter."
                );

                setTimeout(
                    showLoginForm,
                    1000
                );

            }


        } catch (error) {

            console.error(
                "Erreur inscription :",
                error
            );

            showAuthError(
                "Une erreur est survenue :\n" +
                error.message
            );

        } finally {

            button.disabled = false;

            button.textContent =
                "Créer mon compte";

        }

    }
);


/* =========================
   AUTH UI
========================= */

async function updateAuthUI() {

    const {
        data: {
            session
        },
        error
    } =
        await supabaseClient.auth
            .getSession();


    if (error) {

        console.error(
            "Erreur récupération session :",
            error
        );

        return;
    }


    currentUser =
        session?.user || null;


    const email =
        document.getElementById(
            "account-email"
        );

    const authPanel =
        document.getElementById(
            "auth-panel"
        );

    const logoutButton =
        document.getElementById(
            "logout-button"
        );


    if (currentUser) {

        email.textContent =
            currentUser.email ||
            "Compte connecté";

        authPanel.style.display =
            "none";

        logoutButton.style.display =
            "block";

        console.log(
            "Utilisateur connecté :",
            currentUser.id
        );

    } else {

        email.textContent =
            "Non connecté";

        authPanel.style.display =
            "flex";

        logoutButton.style.display =
            "none";

        console.log(
            "Aucun utilisateur connecté."
        );
    }


    await loadConversations();
}


/* =========================
   CREATION CONVERSATION
========================= */

async function createConversation(title) {

    console.log(
        "Tentative de création de conversation..."
    );


    const {
        data: {
            session
        },
        error: sessionError
    } =
        await supabaseClient.auth
            .getSession();


    if (sessionError) {

        throw new Error(
            "Erreur Supabase lors de la récupération de la session : " +
            sessionError.message
        );
    }


    if (!session || !session.user) {

        throw new Error(
            "Vous devez être connecté pour créer une conversation."
        );
    }


    const userId =
        session.user.id;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("conversations")
            .insert({

                user_id:
                    userId,

                title:
                    title ||
                    "Nouvelle conversation"

            })
            .select()
            .single();


    if (error) {

        console.error(
            "Erreur création conversation :",
            error
        );

        throw new Error(
            "Supabase : " +
            error.message +
            (
                error.details
                    ? "\nDétails : " +
                      error.details
                    : ""
            ) +
            (
                error.hint
                    ? "\nIndice : " +
                      error.hint
                    : ""
            )
        );
    }


    console.log(
        "Conversation créée :",
        data
    );


    return data;
}


/* =========================
   HISTORIQUE
========================= */

async function loadConversations() {

    const history =
        document.getElementById(
            "history"
        );


    if (!currentUser) {

        history.innerHTML = `
            <div style="color:#777;font-size:13px;">
                Connectez-vous pour voir votre historique.
            </div>
        `;

        return;
    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("conversations")
            .select("*")
            .eq(
                "user_id",
                currentUser.id
            )
            .order(
                "updated_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "Erreur historique :",
            error
        );

        history.innerHTML = `
            <div style="color:#ff7777;font-size:13px;">
                Erreur historique :<br>
                ${escapeHtml(error.message)}
            </div>
        `;

        return;
    }


    history.innerHTML = "";


    if (!data || data.length === 0) {

        history.innerHTML = `
            <div style="color:#777;font-size:13px;">
                Aucune conversation.
            </div>
        `;

        return;
    }


    data.forEach(
        conversation => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "conversation";


            if (
                conversation.id ===
                currentConversationId
            ) {

                element.classList.add(
                    "active"
                );

            }


            element.textContent =
                conversation.title;


            element.onclick =
                () => {

                    loadConversation(
                        conversation.id
                    );

                };


            history.appendChild(
                element
            );

        }
    );
}


/* =========================
   SAUVEGARDE MESSAGE
========================= */

async function saveMessage(
    conversationId,
    role,
    content
) {

    if (!currentUser) {

        throw new Error(
            "Utilisateur non connecté."
        );
    }


    const {
        error
    } =
        await supabaseClient
            .from("messages")
            .insert({

                conversation_id:
                    conversationId,

                user_id:
                    currentUser.id,

                role:
                    role,

                content:
                    content

            });


    if (error) {

        console.error(
            "Erreur sauvegarde message :",
            error
        );

        throw new Error(
            "Erreur sauvegarde message : " +
            error.message
        );
    }
}


/* =========================
   DATE CONVERSATION
========================= */

async function updateConversationTime(
    conversationId
) {

    if (!currentUser) {
        return;
    }


    const {
        error
    } =
        await supabaseClient
            .from("conversations")
            .update({

                updated_at:
                    new Date().toISOString()

            })
            .eq(
                "id",
                conversationId
            )
            .eq(
                "user_id",
                currentUser.id
            );


    if (error) {

        console.error(
            "Erreur mise à jour conversation :",
            error
        );
    }
}


/* =========================
   CHARGER CONVERSATION
========================= */

async function loadConversation(
    conversationId
) {

    if (!currentUser) {
        return;
    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("messages")
            .select("*")
            .eq(
                "conversation_id",
                conversationId
            )
            .eq(
                "user_id",
                currentUser.id
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "Erreur chargement messages :",
            error
        );

        return;
    }


    currentConversationId =
        conversationId;


    const chat =
        document.getElementById(
            "chat"
        );


    chat.innerHTML = "";


    if (!data || data.length === 0) {

        showWelcome();

    } else {

        data.forEach(
            message => {

                if (
                    message.role ===
                    "user"
                ) {

                    addUserMessage(
                        message.content
                    );

                } else {

                    addAIMessageText(
                        message.content
                    );

                }

            }
        );

    }


    await loadConversations();

    scrollToBottom();
}


/* =========================
   NOUVELLE CONVERSATION
========================= */

function startNewConversation() {

    currentConversationId =
        null;

    showWelcome();

    document
        .getElementById(
            "question"
        )
        .focus();

    loadConversations();
}


/* =========================
   WELCOME
========================= */

function showWelcome() {

    document.getElementById(
        "chat"
    ).innerHTML = `

        <div
            class="welcome"
            id="welcome"
        >

            <h1>
                BibleProIA
            </h1>

            <p>
                Posez vos questions sur la Bible,
                le christianisme et l'adventisme.
            </p>

        </div>

    `;
}


/* =========================
   MESSAGE UTILISATEUR
========================= */

function addUserMessage(text) {

    const welcome =
        document.getElementById(
            "welcome"
        );


    if (welcome) {
        welcome.remove();
    }


    const chat =
        document.getElementById(
            "chat"
        );


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message user";


    message.innerHTML = `

        <div class="bubble">
            ${escapeHtml(text)}
        </div>

    `;


    chat.appendChild(
        message
    );


    scrollToBottom();
}


/* =========================
   MESSAGE IA
========================= */

function addAIMessageText(text) {

    const chat =
        document.getElementById(
            "chat"
        );


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message ai";


    message.innerHTML = `

        <div class="ai-icon">
            ✝
        </div>

        <div class="ai-content">
            ${escapeHtml(text)}
        </div>

    `;


    chat.appendChild(
        message
    );


    scrollToBottom();
}


/* =========================
   THINKING
========================= */

function showThinking() {

    removeThinking();


    const chat =
        document.getElementById(
            "chat"
        );


    const thinking =
        document.createElement(
            "div"
        );


    thinking.className =
        "thinking";

    thinking.id =
        "thinking";


    thinking.innerHTML = `

        <div class="ai-icon">
            ✝
        </div>

        <div>
            BibleProIA réfléchit
            <span class="dots">
                <span>.</span>
                <span>.</span>
                <span>.</span>
            </span>
        </div>

    `;


    chat.appendChild(
        thinking
    );


    scrollToBottom();
}


function removeThinking() {

    const thinking =
        document.getElementById(
            "thinking"
        );


    if (thinking) {
        thinking.remove();
    }
}


/* =========================
   CHAT
========================= */

document
    .getElementById(
        "chat-form"
    )
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            if (loadingMessage) {
                return;
            }


            const input =
                document.getElementById(
                    "question"
                );


            const send =
                document.getElementById(
                    "send"
                );


            const question =
                input.value.trim();


            if (!question) {
                return;
            }


            loadingMessage =
                true;

            send.disabled =
                true;


            try {

                /*
                 * Vérification session
                 */

                const {
                    data: {
                        session
                    },
                    error: sessionError
                } =
                    await supabaseClient.auth
                        .getSession();


                if (sessionError) {

                    throw new Error(
                        "Impossible de récupérer la session Supabase : " +
                        sessionError.message
                    );
                }


                if (
                    !session ||
                    !session.user
                ) {

                    openAuthModal(
                        "login"
                    );

                    throw new Error(
                        "Connectez-vous pour enregistrer vos conversations."
                    );
                }


                currentUser =
                    session.user;


                /*
                 * Créer une conversation
                 * si nécessaire
                 */

                if (
                    !currentConversationId
                ) {

                    const conversation =
                        await createConversation(
                            question.substring(
                                0,
                                60
                            )
                        );


                    currentConversationId =
                        conversation.id;


                    await loadConversations();

                }


                /*
                 * Afficher le message
                 */

                addUserMessage(
                    question
                );


                input.value =
                    "";


                /*
                 * Sauvegarder
                 */

                await saveMessage(
                    currentConversationId,
                    "user",
                    question
                );


                await updateConversationTime(
                    currentConversationId
                );


                /*
                 * Demander la réponse à Flask
                 */

                showThinking();


                const response =
                    await fetch(
                        "/",
                        {
                            method:
                                "POST",

                            headers: {
                                "Content-Type":
                                    "application/x-www-form-urlencoded"
                            },

                            body:
                                new URLSearchParams({
                                    question:
                                        question
                                })
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Le serveur a retourné une erreur HTTP " +
                        response.status
                    );
                }


                const html =
                    await response.text();


                removeThinking();


                /*
                 * Lire la réponse générée
                 * par Flask
                 */

                const parser =
                    new DOMParser();


                const documentResponse =
                    parser.parseFromString(
                        html,
                        "text/html"
                    );


                const answer =
                    documentResponse.querySelector(
                        "#server-answer .answer-text"
                    );


                if (!answer) {

                    console.error(
                        "Réponse HTML reçue :",
                        html
                    );

                    throw new Error(
                        "La réponse de BibleProIA n'a pas pu être récupérée."
                    );
                }


                const answerText =
                    answer.textContent.trim();


                if (!answerText) {

                    throw new Error(
                        "BibleProIA a retourné une réponse vide."
                    );
                }


                /*
                 * Afficher réponse IA
                 */

                addAIMessageText(
                    answerText
                );


                /*
                 * Sauvegarder réponse IA
                 */

                await saveMessage(
                    currentConversationId,
                    "assistant",
                    answerText
                );


                await updateConversationTime(
                    currentConversationId
                );


                await loadConversations();


            } catch (error) {

                removeThinking();


                console.error(
                    "ERREUR CHAT :",
                    error
                );


                const chat =
                    document.getElementById(
                        "chat"
                    );


                const errorBox =
                    document.createElement(
                        "div"
                    );


                errorBox.className =
                    "error";


                errorBox.textContent =
                    "Erreur : " +
                    error.message;


                chat.appendChild(
                    errorBox
                );


                scrollToBottom();

            } finally {

                loadingMessage =
                    false;

                send.disabled =
                    false;

            }

        }
    );


/* =========================
   NOUVELLE CONVERSATION
========================= */

document
    .getElementById(
        "new-chat"
    )
    .addEventListener(
        "click",
        startNewConversation
    );

/* =========================

========================= */

supabaseClient.auth.onAuthStateChange(
    function(event, session) {

        console.log(
            "Auth event :",
            event
        );


        currentUser =
            session?.user || null;


        /*
         * On ne fait pas d'appel Supabase
         * supplémentaire ici.
         * updateAuthUI est appelée après
         * l'initialisation et les connexions.
         */

        const email =
            document.getElementById(
                "account-email"
            );

        const authPanel =
            document.getElementById(
                "auth-panel"
            );

        const logoutButton =
            document.getElementById(
                "logout-button"
            );

            authPanel.style.display =

            logoutButton.style.display =

        } else {

            email.textContent =
                "Non connecté";

            authPanel.style.display =
                "flex";

            logoutButton.style.display =
                "none";

        }

    }
);

   INITIALISATION
========================= */

(async function() {

    );


    await updateAuthUI();


    console.log(

    );

})();
